apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongoexpress
  namespace: mongodb

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongoexpress

  template:
    metadata:
      labels:
        app: mongoexpress

    spec:
      containers:
      - name: mongoexpress

        image: mongo-express:latest

        ports:
        - containerPort: 8081

        env:
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-username

        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-password

        - name: ME_CONFIG_MONGODB_SERVER
          value: mongodb-service
          - name: ME_CONFIG_BASICAUTH
            value: "false"
        
